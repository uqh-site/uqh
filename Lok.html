
<button id="shareLocation" type="button">
  Kirim Lokasi Saya
</button>

<p id="locationStatus" role="status" aria-live="polite">
  Tekan tombol untuk membagikan lokasi.
</p>

<script>
const WORKER_URL =
  "https://lokasi.qornilhakim1.workers.dev/";

const button = document.getElementById("shareLocation");
const statusText = document.getElementById("locationStatus");

button.addEventListener("click", () => {
  if (!navigator.geolocation) {
    statusText.textContent =
      "Browser tidak mendukung fitur lokasi.";
    return;
  }

  button.disabled = true;
  statusText.textContent =
    "Meminta izin lokasi...";

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      try {
        statusText.textContent =
          "Mengirim lokasi ke Telegram...";

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error ||
            `Permintaan gagal: HTTP ${response.status}`
          );
        }

        statusText.textContent =
          "Lokasi berhasil dikirim ke Telegram.";
      } catch (error) {
        console.error(error);

        statusText.textContent =
          "Gagal: " + error.message;
      } finally {
        button.disabled = false;
      }
    },
    (error) => {
      const messages = {
        1: "Izin lokasi ditolak.",
        2: "Lokasi tidak dapat ditentukan.",
        3: "Permintaan lokasi kehabisan waktu."
      };

      statusText.textContent =
        messages[error.code] ||
        "Gagal mengambil lokasi.";

      button.disabled = false;
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});
</script>
