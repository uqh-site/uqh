
<h2>Berbagi Lokasi</h2>

<p>
Jika kamu menyetujui, koordinat perangkat ini akan dikirim
kepada pemilik website melalui Telegram.
</p>

<label>
  <input type="checkbox" id="setuju">
  Saya setuju membagikan koordinat lokasi perangkat ini.
</label>

<p>
  <button id="kirim">Setuju dan kirim lokasi</button>
</p>

<p id="status" aria-live="polite"></p>

<script>
const WORKER_URL = "https://lokasi.qornilhakim1.workers.dev/";

document.getElementById("kirim").onclick = () => {
  const status = document.getElementById("status");

  if (!document.getElementById("setuju").checked) {
    status.textContent = "Setujui terlebih dahulu.";
    return;
  }

  if (!navigator.geolocation) {
    status.textContent = "Browser tidak mendukung lokasi.";
    return;
  }

  status.textContent = "Meminta izin lokasi...";

  navigator.geolocation.getCurrentPosition(async (pos) => {
    status.textContent = "Mengirim lokasi...";

    try {
      const response = await fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          consent: true,
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        })
      });

      if (!response.ok) throw new Error("Gagal");

      status.textContent = "Lokasi berhasil dibagikan.";
    } catch {
      status.textContent = "Pengiriman gagal. Coba lagi.";
    }
  }, () => {
    status.textContent =
      "Lokasi tidak diperoleh. Periksa izin browser.";
  }, {
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 0
  });
};
</script>
