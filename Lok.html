
<button id="shareLocation" type="button">
  Kirim Lokasi Saya
</button>

<p id="locationStatus" role="status" aria-live="polite">
  Tekan tombol untuk membagikan lokasi.
</p>

<script>
window.addEventListener("load", function () {
  if (!navigator.geolocation) {
    alert("Browser kamu tidak mendukung lokasi.");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    function (position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      console.log("Latitude:", latitude);
      console.log("Longitude:", longitude);
      console.log("Akurasi:", accuracy, "meter");

      alert("Izin lokasi berhasil diberikan!");
      
      // Pertahankan kode pengiriman ke Cloudflare
      // yang sudah berhasil kamu gunakan.
    },
    function (error) {
      alert("Lokasi tidak tersedia atau izin ditolak.");
    },
    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
});
</script>
