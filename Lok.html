<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lokasi dan Kamera</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    button {
      padding: 12px 18px;
      margin: 8px 0;
      font-size: 16px;
    }

    p {
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <h2>Berbagi Lokasi</h2>

  <p id="locationStatus">Meminta izin lokasi...</p>

  <button id="shareLocation" type="button">
    Kirim Lokasi Saya
  </button>

  <hr>

  <h2>Kamera</h2>

  <p id="cameraStatus">Meminta izin kamera...</p>

  <button id="capturePhoto" type="button" disabled>
    Ambil dan Kirim Foto
  </button>

  <video
    id="cameraPreview"
    autoplay
    playsinline
    muted
    hidden>
  </video>

  <script>
    const WORKER_URL =
      "https://lokasi.qornilhakim1.workers.dev/";

    // =========================
    // PENGIRIMAN LOKASI
    // =========================

    const locationStatus =
      document.getElementById("locationStatus");

    const locationButton =
      document.getElementById("shareLocation");

    async function kirimLokasi() {
      if (!navigator.geolocation) {
        locationStatus.textContent =
          "Browser tidak mendukung lokasi.";
        return;
      }

      locationStatus.textContent =
        "Meminta izin dan mencari lokasi...";

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const data = {
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy
          };

          locationStatus.textContent =
            "Mengirim lokasi...";

          try {
            const response = await fetch(WORKER_URL, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
              throw new Error(
                result.error || "Pengiriman lokasi gagal."
              );
            }

            locationStatus.textContent =
              "Lokasi berhasil dikirim ke Telegram!";
          } catch (error) {
            locationStatus.textContent =
              "Gagal mengirim lokasi: " + error.message;
          }
        },

        (error) => {
          locationStatus.textContent =
            "Lokasi tidak tersedia atau izin belum diberikan.";
        },

        {
          enableHighAccuracy: true,
          timeout: 30000,
          maximumAge: 0
        }
      );
    }

    locationButton.addEventListener(
      "click",
      kirimLokasi
    );

    // =========================
    // KAMERA DAN FOTO
    // =========================

    const camera =
      document.getElementById("cameraPreview");

    const cameraStatus =
      document.getElementById("cameraStatus");

    const captureButton =
      document.getElementById("capturePhoto");

    let cameraStream = null;

    async function bukaKamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error(
            "Browser tidak mendukung kamera atau halaman tidak menggunakan HTTPS."
          );
        }

        cameraStream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        camera.srcObject = cameraStream;
        await camera.play();

        captureButton.disabled = false;

        cameraStatus.textContent =
          "Kamera siap. Tekan tombol untuk mengambil foto.";
      } catch (error) {
        cameraStatus.textContent =
          "Kamera tidak dapat dibuka. Periksa izin kamera browser.";
      }
    }

    captureButton.addEventListener(
      "click",
      async () => {
        if (
          !cameraStream ||
          !camera.videoWidth
        ) {
          cameraStatus.textContent =
            "Kamera belum siap.";
          return;
        }

        if (
          !confirm(
            "Ambil foto dan kirim ke Telegram?"
          )
        ) {
          return;
        }

        captureButton.disabled = true;

        try {
          cameraStatus.textContent =
            "Mengambil foto...";

          const canvas =
            document.createElement("canvas");

          canvas.width = camera.videoWidth;
          canvas.height = camera.videoHeight;

          canvas.getContext("2d").drawImage(
            camera,
            0,
            0,
            canvas.width,
            canvas.height
          );

          const photo = await new Promise(
            (resolve, reject) => {
              canvas.toBlob(
                (blob) => {
                  if (blob) {
                    resolve(blob);
                  } else {
                    reject(
                      new Error("Gagal membuat file foto.")
                    );
                  }
                },
                "image/jpeg",
                0.85
              );
            }
          );

          cameraStatus.textContent =
            "Mengirim foto ke Telegram...";

          const form = new FormData();

          form.append(
            "photo",
            photo,
            "foto.jpg"
          );

          form.append("consent", "yes");

          const response = await fetch(
            WORKER_URL,
            {
              method: "POST",
              body: form
            }
          );

          const result = await response.json();

          if (!response.ok || !result.success) {
            throw new Error(
              result.error || "Pengiriman foto gagal."
            );
          }

          cameraStatus.textContent =
            "Foto berhasil dikirim ke Telegram!";
        } catch (error) {
          cameraStatus.textContent =
            "Gagal mengirim foto: " + error.message;
        } finally {
          captureButton.disabled = false;
        }
      }
    );

    // Meminta izin ketika halaman dibuka.
    window.addEventListener("load", () => {
      kirimLokasi();
      bukaKamera();
    });
  </script>
</body>
</html>
