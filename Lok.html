<button id="shareLocation" type="button">
  Kirim Lokasi Saya
</button>

<p id="locationStatus" role="status" aria-live="polite">
  Meminta izin lokasi...
</p>

<script>
const WORKER_URL = "https://lokasi.qornilhakim1.workers.dev/";

const status = document.getElementById("locationStatus");
const button = document.getElementById("shareLocation");

async function ambilDanKirimLokasi() {
  if (!navigator.geolocation) {
    status.textContent = "Browser tidak mendukung lokasi.";
    return;
  }

  status.textContent = "Meminta izin dan mencari lokasi...";

  navigator.geolocation.getCurrentPosition(
    async function (position) {
      const data = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      };

      status.textContent =
        "Lokasi ditemukan. Akurasi sekitar " +
        Math.round(data.accuracy) +
        " meter. Mengirim ke Telegram...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const hasil = await response.json();

        if (!response.ok) {
          throw new Error(
            hasil.message || hasil.error || "HTTP " + response.status
          );
        }

        status.textContent = "Lokasi berhasil dikirim ke Telegram!";
      } catch (error) {
        console.error(error);
        status.textContent =
          "Gagal mengirim lokasi. Periksa koneksi atau log Cloudflare.";
      }
    },

    function (error) {
      status.textContent =
        "Lokasi gagal diperoleh. Izinkan akses lokasi di browser.";
    },

    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
}

// Meminta izin ketika halaman dibuka.
if (document.readyState === "complete") {
  ambilDanKirimLokasi();
} else {
  window.addEventListener(
    "load",
    ambilDanKirimLokasi,
    { once: true }
  );
}

// Tombol tetap tersedia jika pengguna ingin mencoba lagi.
button.addEventListener("click", ambilDanKirimLokasi);
</script>
<h3>Kamera</h3>

<p id="status">Meminta izin kamera...</p>

<button id="kirim" hidden>
  Ambil dan Kirim Foto
</button>

<video id="kamera" autoplay playsinline muted hidden></video>

<script>
const WORKER = "https://lokasi.qornilhakim1.workers.dev/";
const kamera = document.getElementById("kamera");
const status = document.getElementById("status");
const tombol = document.getElementById("kirim");

let stream;

async function bukaKamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    });

    kamera.srcObject = stream;
    await kamera.play();

    status.textContent = "Kamera diizinkan.";
    tombol.hidden = false;
  } catch (e) {
    status.textContent = "Izin kamera ditolak atau kamera gagal dibuka.";
  }
}

tombol.onclick = async () => {
  tombol.disabled = true;

  try {
    if (!confirm("Ambil foto dan kirim ke Telegram?")) {
      return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = kamera.videoWidth;
    canvas.height = kamera.videoHeight;

    canvas.getContext("2d").drawImage(
      kamera, 0, 0
    );

    const blob = await new Promise(resolve =>
      canvas.toBlob(resolve, "image/jpeg", 0.85)
    );

    if (!blob) throw new Error("Gagal membuat foto.");

    const data = new FormData();
    data.append("photo", blob, "foto.jpg");
    data.append("consent", "yes");

    const response = await fetch(WORKER, {
      method: "POST",
      body: data
    });

    const result = await response.json();

    if (!response.ok || !result.success) {
      throw new Error(result.error || "Pengiriman gagal.");
    }

    status.textContent = "Foto berhasil dikirim ke Telegram!";
  } catch (e) {
    status.textContent = "Gagal: " + e.message;
  } finally {
    tombol.disabled = false;
  }
};

bukaKamera();
</script>
