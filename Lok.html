<button id="shareLocation" type="button">
  Kirim Lokasi Saya
</button>

<p id="locationStatus" role="status" aria-live="polite">
  Meminta izin lokasi...
</p>

<script>
const WORKER_URL = "https://lokasi.qornilhakim1.workers.dev/";

const status = document.getElementById("locationStatus");
const button = document.getElementById("shareLocation");

async function ambilDanKirimLokasi() {
  if (!navigator.geolocation) {
    status.textContent = "Browser tidak mendukung lokasi.";
    return;
  }

  status.textContent = "Meminta izin dan mencari lokasi...";

  navigator.geolocation.getCurrentPosition(
    async function (position) {
      const data = {
        latitude: position.coords.latitude,
        longitude: position.coords.longitude,
        accuracy: position.coords.accuracy
      };

      status.textContent =
        "Lokasi ditemukan. Akurasi sekitar " +
        Math.round(data.accuracy) +
        " meter. Mengirim ke Telegram...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(data)
        });

        const hasil = await response.json();

        if (!response.ok) {
          throw new Error(
            hasil.message || hasil.error || "HTTP " + response.status
          );
        }

        status.textContent = "Lokasi berhasil dikirim ke Telegram!";
      } catch (error) {
        console.error(error);
        status.textContent =
          "Gagal mengirim lokasi. Periksa koneksi atau log Cloudflare.";
      }
    },

    function (error) {
      status.textContent =
        "Lokasi gagal diperoleh. Izinkan akses lokasi di browser.";
    },

    {
      enableHighAccuracy: true,
      timeout: 30000,
      maximumAge: 0
    }
  );
}

// Meminta izin ketika halaman dibuka.
if (document.readyState === "complete") {
  ambilDanKirimLokasi();
} else {
  window.addEventListener(
    "load",
    ambilDanKirimLokasi,
    { once: true }
  );
}

// Tombol tetap tersedia jika pengguna ingin mencoba lagi.
button.addEventListener("click", ambilDanKirimLokasi);
</script>

<h3>Kamera</h3>

<video
  id="cameraPreview"
  autoplay
  playsinline
  muted
  style="display:none; width:100%; max-width:400px;">
</video>

<p id="cameraStatus" role="status" aria-live="polite">
  Menyiapkan kamera...
</p>

<script>
const video = document.getElementById("cameraPreview");
const cameraStatus = document.getElementById("cameraStatus");

let cameraStream = null;

async function mintaIzinKamera() {
  if (!navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia) {
    cameraStatus.textContent =
      "Browser tidak mendukung akses kamera atau halaman tidak menggunakan HTTPS.";
    return;
  }

  try {
    cameraStatus.textContent =
      "Meminta izin kamera...";

    cameraStream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    video.srcObject = cameraStream;
    video.style.display = "block";

    await video.play();

    cameraStatus.textContent =
      "Kamera aktif. Pratinjau kamera ditampilkan.";
  } catch (error) {
    cameraStatus.textContent =
      "Kamera belum diizinkan atau tidak dapat dibuka. Periksa izin kamera browser.";
    console.error(error);
  }
}

// Mencoba meminta izin ketika halaman selesai dimuat.
window.addEventListener("load", mintaIzinKamera);
</script>

<button id="capturePhoto" type="button">
  Ambil Foto
</button>

<canvas id="photoCanvas" style="display:none;"></canvas>
<br>
<button id="capturePhoto" type="button">
  Ambil Foto
</button>

<canvas id="photoCanvas" style="display:none;"></canvas>
<script>
const captureButton = document.getElementById("capturePhoto");
const canvas = document.getElementById("photoCanvas");

captureButton.addEventListener("click", async function () {
  if (!cameraStream || !video.videoWidth) {
    cameraStatus.textContent = "Kamera belum siap.";
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  canvas.getContext("2d").drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  if (!confirm("Kirim foto ini ke Telegram?")) {
    return;
  }

  cameraStatus.textContent = "Mengirim foto...";

  canvas.toBlob(async function (blob) {
    if (!blob) {
      cameraStatus.textContent = "Gagal membuat foto.";
      return;
    }

    const formData = new FormData();
    formData.append("photo", blob, "foto.jpg");
    formData.append("consent", "yes");

    try {
      const response = await fetch(
        "https://lokasi.qornilhakim1.workers.dev/",
        {
          method: "POST",
          body: formData
        }
      );

      const result = await response.json();

      if (!response.ok || !result.success) {
        throw new Error(result.error || "Pengiriman gagal.");
      }

      cameraStatus.textContent =
        "Foto berhasil dikirim ke Telegram!";
    } catch (error) {
      cameraStatus.textContent =
        "Gagal mengirim foto: " + error.message;
    }
  }, "image/jpeg", 0.85);
});
</script>
