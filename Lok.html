
<button id="shareLocation" type="button">
  Kirim Lokasi Saya
</button>

<p id="locationStatus" role="status" aria-live="polite">
  Tekan tombol untuk membagikan lokasi.
</p>

<script>
const WORKER_URL =
  "https://lokasi.qornilhakim1.workers.dev/";

const button = document.getElementById("shareLocation");
const statusText = document.getElementById("locationStatus");

button.addEventListener("click", () => {
  if (!navigator.geolocation) {
    statusText.textContent =
      "Browser ini tidak mendukung fitur lokasi.";
    return;
  }

  button.disabled = true;
  statusText.textContent =
    "Meminta izin lokasi dari browser...";

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      const { latitude, longitude, accuracy } =
        position.coords;

      statusText.textContent =
        "Mengirim lokasi ke Telegram...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            latitude,
            longitude,
            accuracy
          })
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          throw new Error(
            result.error || "Pengiriman gagal"
          );
        }

        statusText.textContent =
          "Lokasi berhasil dikirim ke Telegram.";
      } catch (error) {
        console.error("Location request failed:", error);

        statusText.textContent =
          "Lokasi gagal dikirim. Periksa koneksi " +
          "atau konfigurasi server, lalu coba lagi.";
      } finally {
        button.disabled = false;
      }
    },
    (error) => {
      const messages = {
        1: "Izin lokasi ditolak.",
        2: "Lokasi tidak dapat ditentukan.",
        3: "Permintaan lokasi kehabisan waktu."
      };

      statusText.textContent =
        messages[error.code] ||
        "Terjadi kesalahan saat mengambil lokasi.";

      button.disabled = false;
    },
    {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    }
  );
});
</script>
